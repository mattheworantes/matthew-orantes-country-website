<dialog class="photo-viewer" aria-label="Photo viewer">
    <button class="photo-viewer-close" type="button" aria-label="Close photo">Close</button>
    <img class="photo-viewer-image" alt="">
</dialog>



    </main>
    <script>
const menuToggle =document.querySelector('.menu-toggle');
const navMenu = document.querySelector('.nav-menu');
const photoViewer = document.querySelector('.photo-viewer');
const photoViewerImage = document.querySelector('.photo-viewer-image');


menuToggle.addEventListener('click', () => {
navMenu.classList.toggle('active');
menuToggle.classList.toggle('active');
});

document.querySelectorAll('.photo-button').forEach((button) => {
    button.addEventListener('click', () => {
        const image = button.querySelector('img');
        photoViewerImage.src = image.src;
        photoViewerImage.alt = image.alt;
        photoViewer.showModal();
    });
});

document.querySelector('.photo-viewer-close').addEventListener('click', () => {
    photoViewer.close();
});

photoViewer.addEventListener('click', (event) => {
    if (event.target === photoViewer) {
        photoViewer.close();
    }
});

</script>
